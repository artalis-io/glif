<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Glif</title>
<style>
:root {
  --surface: #141414;
  --border: #2a2a2a;
  --text: #e0e0e0;
  --text-dim: #666;
  --accent: #4a9eff;
}
* { margin: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; }
#appWrap { display: flex; flex-direction: column; width: 100vw; height: 100vh; }

.canvas-area {
  flex: 1; min-height: 0; position: relative;
}
canvas { display: block; width: 100%; height: 100%; }

/* Compare split divider + labels */
#compareDivider {
  position: absolute; top: 0; width: 3px;
  background: var(--accent); z-index: 5;
  pointer-events: none; display: none;
}
.compare-label {
  position: absolute; top: 8px; padding: 2px 8px;
  background: rgba(0,0,0,0.7); color: var(--text); font-size: 11px;
  border-radius: 3px; z-index: 6; pointer-events: none;
  font-family: -apple-system, system-ui, sans-serif; display: none;
}
#compareLabelL { left: 8px; }
#compareLabelR { right: 8px; }
.canvas-area.compare-active { cursor: ew-resize; }

.drop-overlay {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 16px;
  z-index: 10; cursor: pointer;
  transition: opacity 0.2s;
}
.drop-overlay.hidden { opacity: 0; pointer-events: none; }
.drop-overlay svg { width: 64px; height: 64px; stroke: var(--text-dim); fill: none; stroke-width: 1.5; }
.drop-overlay .label { font-size: 18px; color: var(--text-dim); font-family: -apple-system, system-ui, sans-serif; }
.drop-overlay .sublabel { font-size: 13px; color: #444; font-family: -apple-system, system-ui, sans-serif; }

</style>
</head>
<body>
<div id="appWrap">
  <div class="canvas-area" id="canvasArea">
    <div class="drop-overlay" id="dropOverlay">
      <svg viewBox="0 0 64 64"><path d="M32 8v36M20 32l12 12 12-12"/><rect x="8" y="44" width="48" height="14" rx="3"/></svg>
      <div class="label">Drag &amp; drop image or video</div>
      <div class="sublabel">S = export, F = fullscreen, Space = play/pause</div>
    </div>
    <canvas id="canvas"></canvas>
    <div id="compareDivider"></div>
    <div id="compareLabelL" class="compare-label">Original</div>
    <div id="compareLabelR" class="compare-label">ASCII</div>
  </div>

</div>
<script src="glif.js"></script>
<script src="glif-app.js"></script>
</body>
</html>
