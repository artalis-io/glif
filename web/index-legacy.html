<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glif — ASCII Art Renderer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #1a1a1a; color: #ccc;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
}
#controls {
    padding: 12px 16px; background: #222; border-bottom: 1px solid #333;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    font-size: 13px;
}
#controls label { display: flex; align-items: center; gap: 4px; }
#controls input[type="number"] {
    width: 50px; background: #333; color: #eee; border: 1px solid #555;
    border-radius: 3px; padding: 2px 4px; font-size: 13px;
}
#controls input[type="file"] { font-size: 12px; }
#controls button {
    background: #444; color: #eee; border: 1px solid #666;
    border-radius: 3px; padding: 4px 10px; cursor: pointer; font-size: 13px;
}
#controls button:hover { background: #555; }
#controls .sep { width: 1px; height: 20px; background: #444; }
#status { color: #888; margin-left: auto; }

#drop-zone {
    flex: 1; display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
}
#drop-zone.drag-over::after {
    content: 'Drop file here'; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,100,200,0.2); border: 2px dashed #4af;
    font-size: 24px; color: #4af; pointer-events: none;
}

#output-canvas, #gl-canvas {
    image-rendering: pixelated;
}
#placeholder {
    text-align: center; color: #666;
}
#placeholder p { margin: 8px 0; }

video, #source-canvas { display: none; }
</style>
</head>
<body>

<div id="controls">
    <label>Font: <input type="file" id="font-input" accept=".ttf,.otf,.woff"></label>
    <div class="sep"></div>
    <label>Cell W: <input type="number" id="cell-w" value="10" min="2" max="100"></label>
    <label>Cell H: <input type="number" id="cell-h" value="20" min="2" max="100"></label>
    <div class="sep"></div>
    <label>Dir crunch: <input type="number" id="dir-crunch" value="1.25" min="0" max="10" step="0.05"></label>
    <label>Global crunch: <input type="number" id="global-crunch" value="1.5" min="0" max="10" step="0.05"></label>
    <div class="sep"></div>
    <label>Media: <input type="file" id="media-input" accept="image/*,video/*,.gif"></label>
    <button id="webcam-btn">Webcam</button>
    <span id="status"></span>
</div>

<div id="drop-zone">
    <div id="placeholder">
        <p>Drag &amp; drop an image, video, or GIF</p>
        <p>or use the controls above</p>
    </div>
    <canvas id="gl-canvas" style="display:none;"></canvas>
    <canvas id="output-canvas" style="display:none;"></canvas>
</div>

<video id="video-el" muted playsinline></video>
<canvas id="source-canvas"></canvas>

<script src="glif.js"></script>
<script src="glif-wrapper.js"></script>
<script src="glif-webgl.js"></script>
<script>
(function() {
    const $ = (s) => document.querySelector(s);
    const glCanvas = $('#gl-canvas');
    const outputCanvas = $('#output-canvas');
    const ctx2d = outputCanvas.getContext('2d');
    const videoEl = $('#video-el');
    const sourceCanvas = $('#source-canvas');
    const sourceCtx = sourceCanvas.getContext('2d', { willReadFrequently: true });
    const statusEl = $('#status');
    const placeholder = $('#placeholder');

    let renderer = null;
    let fontBuffer = null;
    let animFrameId = null;
    let isVideo = false;
    let glRenderer = null;
    let useWebGL = false;
    let activeCanvas = null;

    // Try WebGL init
    function initWebGL() {
        try {
            glRenderer = new GlifWebGLRenderer(glCanvas);
            return true;
        } catch (e) {
            console.warn('WebGL not available, using Canvas 2D fallback:', e.message);
            return false;
        }
    }

    let customFontFamily = null;

    function setupGLAtlas(fontFamily) {
        if (!glRenderer) return;
        const cellH = parseInt($('#cell-h').value) || 20;
        const fontSize = Math.max(10, cellH);
        const family = fontFamily || customFontFamily || 'monospace';
        const atlas = GlifRenderer.generateFontAtlas(family, fontSize);
        glRenderer.init(atlas.canvas, atlas.charW, atlas.charH,
                        atlas.physCharW, atlas.physCharH);
        useWebGL = true;
    }

    // Try to auto-load font.ttf
    fetch('font.ttf').then(r => {
        if (r.ok) return r.arrayBuffer();
        throw new Error('not found');
    }).then(buf => {
        fontBuffer = buf;
        statusEl.textContent = 'Font loaded (font.ttf)';
    }).catch(() => {
        statusEl.textContent = 'No font loaded — pick a TTF file';
    });

    // Font input — also register @font-face for atlas rendering
    $('#font-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        fontBuffer = await file.arrayBuffer();
        statusEl.textContent = `Font: ${file.name}`;

        // Register uploaded font as @font-face for atlas
        try {
            const fontFace = new FontFace('glif-custom', fontBuffer);
            await fontFace.load();
            document.fonts.add(fontFace);
            customFontFamily = 'glif-custom';
        } catch (err) {
            console.warn('Could not register @font-face, falling back to monospace:', err);
            customFontFamily = null;
        }

        // Re-init renderer if active
        if (renderer) await initRenderer();
    });

    async function initRenderer() {
        if (!fontBuffer) {
            statusEl.textContent = 'Please load a font first';
            return false;
        }
        if (renderer) renderer.destroy();

        const cellW = parseInt($('#cell-w').value) || 10;
        const cellH = parseInt($('#cell-h').value) || 20;
        const dirCrunch = parseFloat($('#dir-crunch').value) || 1.25;
        const globalCrunch = parseFloat($('#global-crunch').value) || 1.5;

        try {
            renderer = await GlifRenderer.create(fontBuffer, {
                cellW, cellH, dirCrunch, globalCrunch
            });
            // (Re)init WebGL atlas when renderer is created
            if (glRenderer) setupGLAtlas();
            return true;
        } catch (err) {
            statusEl.textContent = `Error: ${err.message}`;
            return false;
        }
    }

    function showCanvas(canvas) {
        if (activeCanvas === canvas) return;
        glCanvas.style.display = 'none';
        outputCanvas.style.display = 'none';
        canvas.style.display = 'block';
        activeCanvas = canvas;
    }

    function renderResult(result) {
        if (!result) return;

        if (useWebGL && glRenderer) {
            glRenderer.render(result);
            const c = glCanvas;
            placeholder.style.display = 'none';
            showCanvas(c);

            // Scale canvas to fit viewport (use logical CSS dimensions)
            const dpr = window.devicePixelRatio || 1;
            const logicalW = c.width / dpr;
            const logicalH = c.height / dpr;
            const dropZone = $('#drop-zone');
            const maxW = dropZone.clientWidth;
            const maxH = dropZone.clientHeight;
            const scale = Math.min(maxW / logicalW, maxH / logicalH, 1);
            c.style.width = Math.floor(logicalW * scale) + 'px';
            c.style.height = Math.floor(logicalH * scale) + 'px';
        } else {
            renderResult2D(result);
        }
    }

    function renderResult2D(result) {
        const { rows, cols, chars, r, g, b } = result;
        const cellW = parseInt($('#cell-w').value) || 10;
        const cellH = parseInt($('#cell-h').value) || 20;
        const fontSize = Math.max(10, cellH);
        const charW = fontSize * 0.6;
        const charH = fontSize;

        const canvasW = Math.ceil(cols * charW);
        const canvasH = rows * charH;

        if (outputCanvas.width !== canvasW || outputCanvas.height !== canvasH) {
            outputCanvas.width = canvasW;
            outputCanvas.height = canvasH;
        }

        ctx2d.fillStyle = '#000';
        ctx2d.fillRect(0, 0, canvasW, canvasH);
        ctx2d.font = `${fontSize}px monospace`;
        ctx2d.textBaseline = 'top';

        for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
                const i = row * cols + col;
                const ch = String.fromCharCode(chars[i]);
                if (ch === ' ') continue;
                ctx2d.fillStyle = `rgb(${r[i]},${g[i]},${b[i]})`;
                ctx2d.fillText(ch, col * charW, row * charH);
            }
        }

        placeholder.style.display = 'none';
        showCanvas(outputCanvas);

        const dropZone = $('#drop-zone');
        const maxW = dropZone.clientWidth;
        const maxH = dropZone.clientHeight;
        const scale = Math.min(maxW / canvasW, maxH / canvasH, 1);
        outputCanvas.style.width = Math.floor(canvasW * scale) + 'px';
        outputCanvas.style.height = Math.floor(canvasH * scale) + 'px';
    }

    async function processImage(img) {
        stopVideo();
        if (!await initRenderer()) return;

        sourceCanvas.width = img.naturalWidth || img.width;
        sourceCanvas.height = img.naturalHeight || img.height;
        sourceCtx.drawImage(img, 0, 0);
        const imageData = sourceCtx.getImageData(0, 0, sourceCanvas.width, sourceCanvas.height);

        const result = renderer.processFrame(
            imageData.data, sourceCanvas.width, sourceCanvas.height, 4
        );
        renderResult(result);
        statusEl.textContent = result
            ? `${result.cols}x${result.rows} grid` + (useWebGL ? ' (WebGL)' : '')
            : 'Processing failed';
    }

    async function startVideo(source) {
        stopVideo();
        if (!await initRenderer()) return;
        isVideo = true;

        if (source instanceof MediaStream) {
            videoEl.srcObject = source;
        } else {
            videoEl.src = source;
            videoEl.loop = true;
        }
        videoEl.play();

        let frameCount = 0;
        let lastFpsTime = performance.now();

        function tick() {
            if (!isVideo) return;

            if (videoEl.readyState >= 2) {
                const w = videoEl.videoWidth;
                const h = videoEl.videoHeight;
                if (sourceCanvas.width !== w || sourceCanvas.height !== h) {
                    sourceCanvas.width = w;
                    sourceCanvas.height = h;
                }
                sourceCtx.drawImage(videoEl, 0, 0, w, h);
                const imageData = sourceCtx.getImageData(0, 0, w, h);
                const result = renderer.processFrame(imageData.data, w, h, 4);
                renderResult(result);
                frameCount++;

                const now = performance.now();
                if (now - lastFpsTime >= 1000) {
                    const fps = frameCount / ((now - lastFpsTime) / 1000);
                    const mode = useWebGL ? ' WebGL' : '';
                    statusEl.textContent = `${result ? result.cols + 'x' + result.rows : '?'} | ${fps.toFixed(1)} fps${mode}`;
                    frameCount = 0;
                    lastFpsTime = now;
                }
            }
            animFrameId = requestAnimationFrame(tick);
        }
        animFrameId = requestAnimationFrame(tick);
    }

    function stopVideo() {
        isVideo = false;
        if (animFrameId) {
            cancelAnimationFrame(animFrameId);
            animFrameId = null;
        }
        if (videoEl.srcObject) {
            videoEl.srcObject.getTracks().forEach(t => t.stop());
            videoEl.srcObject = null;
        }
        videoEl.removeAttribute('src');
        videoEl.pause();
    }

    function handleFile(file) {
        const type = file.type;
        if (type.startsWith('video/') || type === 'image/gif') {
            const url = URL.createObjectURL(file);
            startVideo(url);
        } else if (type.startsWith('image/')) {
            const img = new Image();
            img.onload = () => {
                processImage(img);
                URL.revokeObjectURL(img.src);
            };
            img.src = URL.createObjectURL(file);
        }
    }

    // Media input
    $('#media-input').addEventListener('change', (e) => {
        if (e.target.files[0]) handleFile(e.target.files[0]);
    });

    // Webcam
    $('#webcam-btn').addEventListener('click', async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: 640, height: 480 }
            });
            startVideo(stream);
        } catch (err) {
            statusEl.textContent = `Webcam error: ${err.message}`;
        }
    });

    // Drag and drop
    const dropZone = $('#drop-zone');
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('drag-over');
    });
    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('drag-over');
    });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        const file = e.dataTransfer.files[0];
        if (file) handleFile(file);
    });

    // Re-process on param change (for still images)
    for (const id of ['cell-w', 'cell-h', 'dir-crunch', 'global-crunch']) {
        $(`#${id}`).addEventListener('change', async () => {
            if (renderer && !isVideo) {
                if (sourceCanvas.width > 0 && sourceCanvas.height > 0) {
                    if (!await initRenderer()) return;
                    const imageData = sourceCtx.getImageData(
                        0, 0, sourceCanvas.width, sourceCanvas.height
                    );
                    const result = renderer.processFrame(
                        imageData.data, sourceCanvas.width, sourceCanvas.height, 4
                    );
                    renderResult(result);
                }
            } else if (isVideo) {
                await initRenderer();
            }
        });
    }

    // Init WebGL on load
    initWebGL();
})();
</script>
</body>
</html>
